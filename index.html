<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RV Budget Finder</title><meta name="description" content="Find RV trips that fit your total budget, not just the nightly rate."><link rel="stylesheet" href="styles.css"></head><body><main><section class="hero"><p class="eyebrow">RV BUDGET FINDER</p><h1>How much RV trip can your budget buy?</h1><p class="sub">Tell us where, when and your max budget. We’ll rank the cheapest trip options by estimated total cost.</p><form id="search"><label>Starting location<input id="location" placeholder="Wilmington, NC" required></label><div class="grid"><label>Pick up<input id="from" type="date" required></label><label>Return<input id="to" type="date" required></label></div><div class="grid"><label>Travelers<input id="guests" type="number" min="1" max="12" value="2" required></label><label>Maximum total budget ($)<input id="budget" type="number" min="100" step="50" value="1500" required></label></div><label>Search radius<select id="radius"><option value="50">50 miles</option><option value="100" selected>100 miles</option><option value="200">200 miles</option><option value="300">300 miles</option></select></label><button>Find my cheapest RV trips</button></form><p class="fine">No booking fees from us. We may earn a commission if you book through a partner.</p></section><section id="status" class="status" hidden></section><section id="results" class="results"></section></main><script src="app.js"></script></body></html>
